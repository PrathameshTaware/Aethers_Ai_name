AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saans - Air-Safety School Day Planner Infrastructure (Environmental Hacks 2026)

Parameters:
  AdminApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Secret for the x-saans-admin-key header on GET /decisions (returns approval links). Pass at deploy time; never commit.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: On-demand Bedrock text model that drafts notices and is probed by /health (e.g. anthropic.claude-3-haiku-20240307-v1:0).
  FallbackModelApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional key for the fallback model (Groq), used only when Bedrock fails and always labelled model_provider=fallback. Empty disables it.
  TwilioAccountSid:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional. Twilio WhatsApp sandbox for demo delivery of approved parent notices. Empty disables it.
  TwilioAuthToken:
    Type: String
    NoEcho: true
    Default: ""
  TwilioWhatsAppFrom:
    Type: String
    Default: "whatsapp:+14155238886"
    Description: The Twilio WhatsApp sandbox sender.
  DemoWhatsAppTo:
    Type: String
    NoEcho: true
    Default: ""
    Description: Comma-separated demo phones that joined the sandbox. Never stored or audited.
  TwilioContentSid:
    Type: String
    Default: ""
    Description: Optional HX... template SID. Twilio trial accounts can only send Twilio's pre-approved templates; set this to use one.
  TwilioContentVariables:
    Type: String
    Default: ""
    Description: Optional JSON for the template's variables, with {receipt_url}, {date} and {stage} filled in per run.
  MetaWaToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional. Meta WhatsApp Cloud API token for demo delivery (used instead of Twilio when set).
  MetaWaPhoneNumberId:
    Type: String
    Default: ""
    Description: The Meta WhatsApp test number's Phone number ID.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address to receive CloudWatch alarms (failed executions, fail-safe runs, anchor refused).
  ApprovalEmail:
    Type: String
    Default: ""
    Description: Optional email address of the principal to receive approval links when a run pauses.
  ApprovalSmsTo:
    Type: String
    Default: ""
    Description: Optional E.164 phone number to receive approval SMS when a run pauses.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasApprovalEmail: !Not [!Equals [!Ref ApprovalEmail, ""]]
  HasApprovalSmsTo: !Not [!Equals [!Ref ApprovalSmsTo, ""]]

Globals:
  Function:
    # One bundle for every function, built by scripts/build_lambda.py (services/ + data/).
    CodeUri: .lambda_src/
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref SaansTable
        APP_REGION: !Ref "AWS::Region"
        DELHI_STAGE_DEFAULT: "III"
        # Deployed runs use the Open-Meteo forecast; replay only when asked or as the labelled fallback
        DEFAULT_FORECAST_SOURCE: "live"
        # Must equal TimeoutSeconds of the approval states in services/workflow/state_machine.json
        APPROVAL_TIMEOUT_SECONDS: "60"
  Api:
    TracingEnabled: true
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,x-saans-admin-key'"
      AllowMethods: "'GET,POST,OPTIONS'"

Resources:
  # 1. DynamoDB Single Table
  SaansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SaansStateTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 2. Ingest and Planner Lambda Function
  IngestPlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.planner.handler.lambda_handler
      Description: LoadContext step - classifies periods and generates Plan A/B (invoked by SaansWorkflow)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable

  # 3. Stage Rehearsal Lambda Function (Powers the interactive slider)
  RehearseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.planner.handler.rehearse_handler
      Description: Instant re-plan simulator for Stage I-IV rehearsal slider
      Policies:
        - DynamoDBReadPolicy:  # the approved ruleset
            TableName: !Ref SaansTable
      Events:
        RehearseApi:
          Type: Api
          Properties:
            Path: /rehearse
            Method: post

  # 4. Approvals and Callback Handler
  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.workflow.handler.approval_handler
      Description: POST /approve/{shortId} - consumes a role-bound token and resumes the paused workflow
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
              # By name, not !Ref: referencing the resource creates a cycle (API -> approval role ->
              # workflow -> notify -> API, because notify links to the API's receipt page).
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:SaansWorkflow-${AWS::StackName}"
      Events:
        ApproveApi:
          Type: Api
          Properties:
            Path: /approve/{shortId}
            Method: post
        ApprovePageApi:
          Type: Api
          Properties:
            Path: /approve/{shortId}
            Method: get

  # 5. Public Receipt Verification API
  ReceiptVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.audit.handler.receipt_handler
      Description: GET /receipts/{id} - tenant hash chain from DynamoDB for in-browser verification
      Environment:
        Variables:
          ANCHOR_BUCKET: !Ref AnchorBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SaansTable
        - S3ReadPolicy:
            BucketName: !Ref AnchorBucket
      Events:
        ReceiptApi:
          Type: Api
          Properties:
            Path: /receipts/{id}
            Method: get

  # 5b. Public browser verifier page (fetches /receipts/{id} and recomputes hashes client-side)
  VerifyPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.audit.handler.verify_page_handler
      Description: GET /verify/{id} - self-contained receipt verification page
      MemorySize: 128
      Events:
        VerifyPageApi:
          Type: Api
          Properties:
            Path: /verify/{id}
            Method: get

  # 5c. Health: table, ruleset, declared stage, forecast freshness, Bedrock usability, audit head
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.health.handler.health_handler
      Description: GET /health - what works right now (ok / degraded / down)
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FALLBACK_MODEL_API_KEY: !Ref FallbackModelApiKey
      Policies:
        - DynamoDBCrudPolicy:  # reads chain/META; writes the forecast cache
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get

  # 5d. Hourly forecast chart API
  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.forecast.handler.forecast_handler
      Description: GET /forecast - hourly PM2.5 chart data with product thresholds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
      Events:
        ForecastApi:
          Type: Api
          Properties:
            Path: /forecast
            Method: get

  # 5e. Circular reader: Bedrock proposes rules, code validates, a person approves the ruleset diff
  CircularFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.circular.handler.circular_handler
      Description: GET/POST /circulars, POST /rulesets/{candidateId}/approve, GET /rulesets/active
      Environment:
        Variables:
          ADMIN_API_KEY: !Ref AdminApiKey
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FALLBACK_MODEL_API_KEY: !Ref FallbackModelApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        CircularPage:
          Type: Api
          Properties:
            Path: /circulars
            Method: get
        CircularRead:
          Type: Api
          Properties:
            Path: /circulars
            Method: post
        RulesetApprove:
          Type: Api
          Properties:
            Path: /rulesets/{candidateId}/approve
            Method: post
        RulesetActive:
          Type: Api
          Properties:
            Path: /rulesets/active
            Method: get

  # 6. Bilingual Notification & WhatsApp Dispatch Function
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.notify.handler.notify_handler
      Description: DraftAndDispatchNotices step - bilingual notices (Bedrock or static template) with receipt link
      Environment:
        Variables:
          # Notices link to this API's public receipt page: {PUBLIC_BASE_URL}/verify/{receipt_id}
          PUBLIC_BASE_URL: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FALLBACK_MODEL_API_KEY: !Ref FallbackModelApiKey
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
          TWILIO_WHATSAPP_FROM: !Ref TwilioWhatsAppFrom
          DEMO_WHATSAPP_TO: !Ref DemoWhatsAppTo
          TWILIO_CONTENT_SID: !Ref TwilioContentSid
          TWILIO_CONTENT_VARIABLES: !Ref TwilioContentVariables
          META_WA_TOKEN: !Ref MetaWaToken
          META_WA_PHONE_NUMBER_ID: !Ref MetaWaPhoneNumberId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  # 7. Approval request step (waitForTaskToken target)
  RequestApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.workflow.request.request_approval_handler
      Description: Stores the task token behind a short, role-bound, expiring approval ID
      Environment:
        Variables:
          PUBLIC_BASE_URL: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
          APPROVAL_TOPIC_ARN: !Ref ApprovalTopic
          APPROVAL_SMS_TO: !Ref ApprovalSmsTo
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"

  # 8. Principal Brief (read-only, admin key)
  DecisionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.workflow.decisions.decisions_handler
      Description: GET /decisions - plan, explanations and the pending approval link
      Environment:
        Variables:
          ADMIN_API_KEY: !Ref AdminApiKey
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SaansTable
      Events:
        DecisionsApi:
          Type: Api
          Properties:
            Path: /decisions
            Method: get

  # 8b. Forecast Watch scheduled evaluator
  WatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.forecast.watch.watch_handler
      Description: Daily proactive forecast watch contingency evaluation (16:30 IST)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: "cron(0 11 * * ? *)"
            Description: Run daily at 16:30 IST (11:00 UTC)

  # 8c. Forecast Watch API (admin key)
  WatchApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.forecast.handler.watch_get_handler
      Description: GET /watch - contingency drafts and promotion hint
      Environment:
        Variables:
          ADMIN_API_KEY: !Ref AdminApiKey
          # Referencing the Trigger function here creates a cycle through the REST API; the hint looks its name up instead.
          STACK_NAME: !Ref AWS::StackName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SaansTable
      Events:
        WatchApi:
          Type: Api
          Properties:
            Path: /watch
            Method: get

  # 9. Workflow audit steps (interim until hack_win M3: logs only)
  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.audit.handler.audit_event_handler
      Description: Audit close / fail-safe steps of SaansWorkflow
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable

  AnchorBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "saans-audit-anchors-${AWS::AccountId}-${AWS::Region}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 365
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # 9b. Audit Anchor Lambda Function (nightly schedule + Object Lock)
  AnchorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.audit.anchor.anchor_handler
      Description: Nightly anchor of tenant audit heads into S3 Object Lock bucket
      Tracing: Active
      Environment:
        Variables:
          ANCHOR_BUCKET: !Ref AnchorBucket
          ANCHOR_TENANTS: "TENANT#demo"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansTable
        - S3CrudPolicy:
            BucketName: !Ref AnchorBucket
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            Schedule: "cron(25 18 * * ? *)"
            Name: SaansNightlyAnchorSchedule
            Description: Nightly audit head anchor for schools (23:55 IST)
            Enabled: true

  # 10. Decision workflow: plan -> wait for principal -> escalate -> notify / fail safe
  SaansWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "SaansWorkflow-${AWS::StackName}"
      Type: STANDARD  # waitForTaskToken requires Standard workflows
      Tracing:
        Enabled: true
      DefinitionUri: ../services/workflow/state_machine.json
      DefinitionSubstitutions:
        IngestPlannerFunctionArn: !GetAtt IngestPlannerFunction.Arn
        RequestApprovalFunctionArn: !GetAtt RequestApprovalFunction.Arn
        NotificationFunctionArn: !GetAtt NotificationFunction.Arn
        AuditFunctionArn: !GetAtt AuditFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IngestPlannerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RequestApprovalFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AuditFunction

  # 11. Run trigger: execution name = decision ID, so duplicate triggers are refused by Step Functions
  TriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.workflow.trigger.trigger_handler
      Description: Starts SaansWorkflow idempotently (one execution per tenant/date/session)
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref SaansWorkflow
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SaansTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt SaansWorkflow.Name
        - Statement:
            - Effect: Allow
              Action:
                - states:DescribeExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${SaansWorkflow.Name}:*"
      Events:
        EveningRun:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 * * ? *) # 19:30 IST: plan tomorrow (date defaults to tomorrow, IST)
            Name: SaansEveningWorkflowSchedule
            Description: Daily evening re-plan for the demo tenant
            Enabled: true
            Input: '{"tenant_id": "TENANT#demo"}'  # stage comes from the tenant record

  # 12. HTTP run trigger (admin key): same idempotent start as the Trigger Lambda, for demos without a CLI
  RunsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .lambda_src/
      Handler: services.workflow.runs.runs_handler
      Description: POST /runs - starts SaansWorkflow idempotently for one tenant/date/session
      Environment:
        Variables:
          ADMIN_API_KEY: !Ref AdminApiKey
          # By name, not !Ref: this function is behind the API, so referencing the workflow creates the same
          # cycle as ApprovalFunction (API -> this -> workflow -> notify -> API, notify links to the receipt page).
          STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:SaansWorkflow-${AWS::StackName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SaansTable
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:SaansWorkflow-${AWS::StackName}"
            - Effect: Allow
              Action:
                - states:DescribeExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:SaansWorkflow-${AWS::StackName}:*"
      Events:
        RunsApi:
          Type: Api
          Properties:
            Path: /runs
            Method: post

  # 13. Approval SNS Topic & Subscriptions
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "saans-approvals-${AWS::StackName}"
      DisplayName: Saans Decision Approvals

  ApprovalEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasApprovalEmail
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: email
      Endpoint: !Ref ApprovalEmail

  ApprovalSmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasApprovalSmsTo
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: sms
      Endpoint: !Ref ApprovalSmsTo

  # 14. Observability: CloudWatch Alarms & Alert Topic
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "saans-alerts-${AWS::StackName}"
      DisplayName: Saans System Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  WorkflowExecutionFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-workflow-failed"
      AlarmDescription: Fires when a Saans workflow execution fails
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref SaansWorkflow
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic

  WorkflowExecutionTimedOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-workflow-timed-out"
      AlarmDescription: Fires when a Saans workflow execution times out or enters fail-safe
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref SaansWorkflow
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic

  AnchorRefusedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-anchor-refused"
      AlarmDescription: Fires when nightly S3 Object Lock anchor fails or refuses a tampered chain
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnchorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  StateMachineArn:
    Description: SaansWorkflow ARN
    Value: !Ref SaansWorkflow
  TriggerFunctionName:
    Description: Start a run with aws lambda invoke --function-name <this> (idempotent per decision)
    Value: !Ref TriggerFunction
  AnchorFunctionName:
    Description: Name of the Lambda function that anchors the audit chain to S3
    Value: !Ref AnchorFunction
  AnchorBucketName:
    Description: Name of the S3 Object Lock bucket
    Value: !Ref AnchorBucket
  ApprovalTopicArn:
    Description: SNS Topic ARN for approval notifications
    Value: !Ref ApprovalTopic
  AlertTopicArn:
    Description: SNS Topic ARN for CloudWatch alerts
    Value: !Ref AlertTopic
  SaansTableArn:
    Description: DynamoDB Single Table ARN
    Value: !GetAtt SaansTable.Arn
  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
